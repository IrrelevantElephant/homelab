---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-argocd
spec:
  selector:
    matchLabels:
      app: cloudflared-argocd
  replicas: 2
  template:
    metadata:
      labels:
        app: cloudflared-argocd
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.2.0
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 1
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
      volumes:
        - name: creds
          secret:
            secretName: argocd-tunnel-creds
        - name: config
          configMap:
            name: cloudflared-argocd
            items:
              - key: config.yaml
                path: config.yaml
