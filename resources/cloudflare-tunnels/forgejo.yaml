---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-forgejo
  namespace: forgejo
spec:
  selector:
    matchLabels:
      app: cloudflared-forgejo
  replicas: 2
  template:
    metadata:
      labels:
        app: cloudflared-forgejo
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.2.0
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 1
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
      volumes:
        - name: creds
          secret:
            secretName: forgejo-tunnel-creds
        - name: config
          configMap:
            name: cloudflared-forgejo
            items:
              - key: config.yaml
                path: config.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-forgejo
  namespace: forgejo
data:
  config.yaml: |
    tunnel: forgejo
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
    - hostname: git.giulia-harry.dev
      service: http://forgejo.forgejo:3000
    - hostname: ssh-git.giulia-harry.dev
      service: ssh://forgejo-ssh.forgejo:22
    - service: http_status:404
